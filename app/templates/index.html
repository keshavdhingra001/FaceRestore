<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FaceRestore Studio - face masking and reconstruction workspace">
    <title>FaceRestore Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=6">
</head>
<body>
    <nav class="topbar">
        <a class="brand" href="/" aria-label="FaceRestore Studio">
            <span class="brand-name">FaceRestore</span>
        </a>
        <div class="topbar-actions">
            <label class="engine-picker">
                <span>Model</span>
                <select id="engine-select" aria-label="Model"></select>
            </label>
            <button class="btn btn-pick-random" type="button">Sample</button>
            <button class="btn btn-load" type="button">Upload</button>
            <button class="btn btn-save" type="button">Export</button>
        </div>
    </nav>

    <main class="workspace" id="workspace">
        <section class="stage">
            <div class="canvas-panel">
                <div class="panel-head">
                    <span class="panel-title">Source</span>
                    <span class="panel-meta" id="mask-coverage">Mask 0%</span>
                </div>
                <div class="canvas-shell" id="source-shell">
                    <canvas id="canvas-in" width="512" height="512"></canvas>
                    <canvas id="canvas-mask" width="512" height="512"></canvas>
                    <div class="empty-state" id="empty-state">Drop an image or choose Sample</div>
                </div>
            </div>

            <div class="canvas-panel" id="result-panel">
                <div class="panel-head">
                    <span class="panel-title">Restored</span>
                    <span class="panel-meta" id="model-status">Idle</span>
                </div>
                <div class="canvas-shell result-shell" id="result-shell">
                    <canvas id="canvas-out" width="512" height="512"></canvas>
                    <canvas id="canvas-compare-source" width="512" height="512"></canvas>
                    <div class="compare-labels" aria-hidden="true">
                        <span>Before</span>
                        <span>After</span>
                    </div>
                    <input
                        class="compare-range"
                        type="range"
                        id="compare-slider"
                        min="0"
                        max="100"
                        value="50"
                        aria-label="Before and after comparison"
                    >
                    <span class="compare-handle" id="compare-handle"></span>
                    <div class="loading-overlay" id="loading-overlay">
                        <div class="loader"></div>
                        <span>Restoring</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="control-strip" aria-label="Mask controls">
            <div class="control-group segmented" role="group" aria-label="Brush mode">
                <button class="tool-btn active" type="button" data-mode="mask">Mask</button>
                <button class="tool-btn" type="button" data-mode="erase">Erase</button>
            </div>

            <label class="slider-control">
                <span>Brush</span>
                <input type="range" id="brush-slider" min="2" max="64" value="18">
                <output id="brush-size">18</output>
            </label>

            <label class="slider-control">
                <span>Overlay</span>
                <input type="range" id="mask-opacity" min="15" max="95" value="72">
                <output id="opacity-value">72</output>
            </label>

            <div class="control-group">
                <button class="btn ghost" id="btn-undo" type="button" title="Undo">Undo</button>
                <button class="btn ghost" id="btn-redo" type="button" title="Redo">Redo</button>
                <button class="btn ghost" id="btn-clear" type="button" title="Clear mask">Clear</button>
                <button class="btn ghost" id="btn-fill" type="button" title="Mask the whole image">Fill</button>
            </div>
        </section>

        <section class="control-strip lower-strip" aria-label="Review controls">
            <div class="status-line" id="status-line">Loading sample image</div>
        </section>

        <section class="face-tools hidden" id="face-tools" aria-label="Face region masks">
            <div class="panel-head">
                <span class="panel-title">Face Regions</span>
                <span class="panel-meta">Auto masks</span>
            </div>
            <div class="region-grid">
                <!-- Left and right as seen in the picture; region names are the subject's side. -->
                <button class="region-btn" type="button" data-region="right_eye,left_eye">Both eyes</button>
                <button class="region-btn" type="button" data-region="right_eye">Left eye</button>
                <button class="region-btn" type="button" data-region="left_eye">Right eye</button>
                <button class="region-btn" type="button" data-region="nose">Nose</button>
                <button class="region-btn" type="button" data-region="mouth">Mouth</button>
                <button class="region-btn" type="button" data-region="forehead">Forehead</button>
                <button class="region-btn" type="button" data-region="right_cheek">Left cheek</button>
                <button class="region-btn" type="button" data-region="left_cheek">Right cheek</button>
                <button class="region-btn" type="button" data-region="chin">Chin</button>
            </div>
        </section>
    </main>

    <div id="drop-zone" class="drop-zone">
        <div class="drop-zone-inner">
            <strong>Drop image</strong>
            <span>PNG, JPG, or WEBP</span>
        </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <input type="file" id="file-upload" accept="image/*" hidden>

    <script src="/static/main.js?v=7"></script>
</body>
</html>
